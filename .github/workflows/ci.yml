name: CI & Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            cc: gcc
            pkg: ""
          - arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install cross-compiler
        if: matrix.pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}

      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=v0.3.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build C-Shared Library (.so)
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist/package
          go build -trimpath -buildmode=c-shared \
            -o dist/package/codex-turn-state-cache.so \
            ./cmd/plugin
          
          # Copy to architecture-specific name for direct asset use
          cp dist/package/codex-turn-state-cache.so dist/codex-turn-state-cache_linux_${{ matrix.arch }}.so

      - name: Package Zip Asset
        run: |
          cd dist/package
          zip -9 ../codex-turn-state-cache_${{ steps.version.outputs.TAG }}_linux_${{ matrix.arch }}.zip codex-turn-state-cache.so
          cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.so
            dist/*.zip

  build-darwin:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            target: arm64-apple-macos11
          - arch: amd64
            goarch: amd64
            target: x86_64-apple-macos10.15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=v0.3.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build C-Shared Library (.dylib)
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CC: clang -target ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          go build -trimpath -buildmode=c-shared \
            -o dist/package/codex-turn-state-cache.dylib \
            ./cmd/plugin
          
          # Copy to architecture-specific name for direct asset use
          cp dist/package/codex-turn-state-cache.dylib dist/codex-turn-state-cache_darwin_${{ matrix.arch }}.dylib

      - name: Package Zip Asset
        run: |
          cd dist/package
          zip -9 ../codex-turn-state-cache_${{ steps.version.outputs.TAG }}_darwin_${{ matrix.arch }}.zip codex-turn-state-cache.dylib
          cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: |
            dist/*.dylib
            dist/*.zip

  release:
    name: Release Assets
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip *.so *.dylib > checksums.txt 2>/dev/null || sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
